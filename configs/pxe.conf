port=0
interface=enp0s8
bind-interfaces

# DHCP
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h

# DNS servers for clients (dnsmasq itself has DNS off, port=0)
dhcp-option=option:dns-server,1.1.1.1,9.9.9.9

# Fixed IP for Ziel-VM (needed for Ansible inventory)
dhcp-host=08:00:27:56:46:dc,ziel-vm,192.168.50.10

# TFTP
enable-tftp
tftp-root=/srv/tftp

# recognize client architecture (DHCP option 93)
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0

# recognize iPXE WITH HTTP support (option 175, feature 19)
# user class "iPXE" alone is not enough: VirtualBox BIOS PXE ROM is iPXE without HTTP
dhcp-match=set:ipxe-http,175,19

# stage 1: load full iPXE via TFTP
dhcp-boot=tag:efi64,tag:!ipxe-http,ipxe.efi
dhcp-boot=tag:bios,tag:!ipxe-http,undionly.kpxe

# stage 2: iPXE downloads script via HTTP
dhcp-boot=tag:ipxe-http,http://192.168.50.1/boot.ipxe

log-dhcp
