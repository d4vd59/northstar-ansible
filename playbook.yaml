---
- name: Configure Webservers
  hosts: webservers
  become: true
  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure Nginx service is running and enabled
      service:
        name: nginx
        state: started
        enabled: true

- name: Configure DB Servers
  hosts: dbservers
  become: true
  tasks:
    - name: Ensure MariaDB is installed
      apt:
        name: mariadb-server
        state: present
        update_cache: yes

    - name: Ensure MariaDB service is running and enabled
      service:
        name: mariadb
        state: started
        enabled: true
