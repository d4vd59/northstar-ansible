port=0
interface=enp0s8
bind-interfaces

# DHCP
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h

# TFTP
enable-tftp
tftp-root=/srv/tftp

# recognize Client-Architecture
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0

# recognize iPXE
dhcp-userclass=set:ipxe,iPXE

# download iPXE via TFTP
dhcp-boot=tag:efi64,tag:!ipxe,ipxe.efi
dhcp-boot=tag:bios,tag:!ipxe,undionly.kpxe

# download script via HTTP
dhcp-boot=tag:ipxe,http://192.168.50.1/boot.ipxe

log-dhcp
